<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    svg:hover .orbit-circle {
      transform-origin: center;
      animation: rotate 8s linear infinite;
    }
  </style>
  <defs>
    <!-- Purple Dominant Gradient -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B2EFF"/>  <!-- deep purple -->
      <stop offset="60%" stop-color="#9B5CFF"/> <!-- lighter purple -->
      <stop offset="85%" stop-color="#3DA9FC"/> <!-- subtle blue -->
      <stop offset="100%" stop-color="#FFD166"/> <!-- hint of gold -->
    </linearGradient>
    <!-- Stronger Neon Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Orbit (thin + elegant) -->
  <circle class="orbit-circle" cx="110" cy="110" r="72"
          stroke="url(#purpleGrad)"
          stroke-width="1.8"
          opacity="0.6"
          fill="none"
          filter="url(#glow)"/>
  <!-- Orbit Accent Arc (motion feel) -->
  <path d="M50 110 A60 60 0 0 1 170 110"
        stroke="#9B5CFF"
        stroke-width="1.2"
        stroke-dasharray="8 10"
        opacity="0.5"
        fill="none"/>
  <!-- Orbit Node -->
  <circle cx="182" cy="110" r="4" fill="#9B5CFF" filter="url(#glow)"/>
  <!-- Stylized A -->
  <path d="M110 50 L150 170 H132 L120 138 H100 L88 170 H70 L110 50 Z
           M102 120 H118 L110 96 Z"
        fill="url(#purpleGrad)"
        filter="url(#glow)"/>
</svg>
